# SecureBERT 2.0 base (~150M) -- ModernBERT trained on a security corpus. Max length 1024.
run_name: securebert2
model_name: cisco-ai/SecureBERT2.0-base
backend: hf_encoder

input_mode: window
max_length: 1024

loss_type: asl
num_epochs: 10
batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
early_stopping_patience: 3

output_dir: ./outputs/securebert2
